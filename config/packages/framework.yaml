# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    enabled_locales: [fr, en, es, pt, de, it]

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    rate_limiter:
        register:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        reset_password:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        hint:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        verify_resend:
            policy: sliding_window
            limit: 3
            interval: '1 hour'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    framework:
        # Seuls ces noms de site sont acceptés dans l'en-tête Host. Sans cela, une requête avec un faux nom pouvait
        # faire générer des liens vers un autre domaine (par exemple dans l'email de réinitialisation du mot de passe).
        # Le « www » doit y rester : la redirection vers l'adresse officielle ne s'applique qu'après ce contrôle.
        trusted_hosts:
            - '^mybabyguessr\.com$'
            - '^www\.mybabyguessr\.com$'
